<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1a12">
<title>축구 포지션</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="포지션">
<link rel="stylesheet" href="assets/app.css?v=12">
</head>
<body>
<header class="top">
  <input id="title" class="title" maxlength="30" placeholder="경기 이름 (예: 토요 조기축구)">
  <div class="tools">
    <select id="formation" aria-label="포메이션"></select>
    <button id="shareBtn" title="라인업 텍스트 복사">공유</button>
    <button id="menuBtn" title="더보기">⋯</button>
  </div>
</header>

<section class="pitch-wrap">
  <div id="pitch" class="pitch">
    <div class="line box"></div>
    <div class="line six"></div>
    <div class="line arc"></div>
    <div class="line circle"></div>
    <div class="line corner cl"></div>
    <div class="line corner cr"></div>
    <div id="slots"></div>
    <div class="pitch-tools">
      <button type="button" id="viewBadge" class="reset-btn view-badge" hidden>👀 보기 전용</button>
      <button type="button" id="saveBtn" class="reset-btn">💾 저장함</button>
      <button type="button" id="resetBtn" class="reset-btn">↺ 기본 위치</button>
    </div>
  </div>
</section>

<section class="bench" data-bench-zone="1">
  <div class="bench-bar">
    <button id="benchToggle" class="bench-toggle" aria-expanded="false">후보 <b id="benchCount">0</b>명 <span id="benchArrow">▴</span></button>
    <button id="addBtn">+ 추가</button>
  </div>
  <div id="benchPanel" class="bench-panel" hidden>
    <ul id="benchList" class="bench-chips"></ul>
    <p class="hint">끌어서 경기장 선수 위에 놓으면 교체 · 탭하면 수정</p>
  </div>
</section>

<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h3 id="editTitle">선수 정보</h3>
    <div class="pos-row" id="posRow">
      <label>포지션 <input id="fPos" maxlength="8" placeholder="예: ST"></label>
      <button type="button" id="posListBtn">☰ 목록</button>
    </div>
    <label>백넘버 <input id="fNum" inputmode="numeric" maxlength="3" placeholder="10"></label>
    <label>이름 <input id="fName" maxlength="12" placeholder="이름"></label>
    <div class="dlg-btns">
      <button type="button" id="fBench" class="ghost">후보로 보내기</button>
      <button type="button" id="fDelete" class="danger">삭제</button>
      <span class="sp"></span>
      <button value="cancel" class="ghost">취소</button>
      <button value="ok" id="fOk" class="primary">저장</button>
    </div>
  </form>
</dialog>

<dialog id="menuDlg">
  <form method="dialog">
    <h3>더보기</h3>
    <button type="button" id="resetPos" class="wide">포지션·위치 초기화 (포메이션 기본값)</button>
    <button type="button" id="clearAll" class="wide danger">전체 초기화</button>
    <h4 class="menu-sub">팀 공유</h4>
    <div class="pos-row">
      <label>비밀번호 <input id="syncPw" type="password" autocomplete="off" placeholder="팀 비밀번호"></label>
      <button type="button" id="syncPwSave">저장</button>
    </div>
    <p id="syncStatus" class="hint"></p>
    <div class="dlg-btns invite">
      <button type="button" id="inviteView">👀 보기 링크 보내기</button>
      <button type="button" id="inviteEdit">✏️ 수정 링크 보내기</button>
    </div>
    <p class="hint">보기 링크: 멤버 누구나 라인업을 볼 수 있어요. 수정 링크: 팀 비밀번호가 들어 있어 받은 사람도 바꿀 수 있어요(운영진용).</p>
    <div class="dlg-btns"><span class="sp"></span><button class="ghost">닫기</button></div>
  </form>
</dialog>

<dialog id="posDlg" class="pos-dlg">
  <div class="pos-dlg-head"><h3>포지션 목록</h3><button type="button" id="posClose" class="ghost">닫기</button></div>
  <p class="hint">표준 포지션은 고르면 경기장의 그 자리로 이동해요. 전술 역할·옛 포지션은 이름만 바뀌어요.</p>
  <div id="posList" class="pos-list"></div>
</dialog>

<dialog id="slotDlg" class="pos-dlg">
  <div class="pos-dlg-head"><h3>저장함</h3><button type="button" id="slotClose" class="ghost">닫기</button></div>
  <p class="hint" id="slotHint"></p>
  <ol id="slotList" class="slot-list"></ol>
  <div class="slot-foot"><button type="button" id="slotAdd" class="wide ghost">+ 저장 칸 추가</button></div>
</dialog>

<div id="toast" class="toast"></div>
<script src="assets/app.js?v=12"></script>
</body>
</html>
